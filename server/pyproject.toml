[project]
name = "playpalace-server"
version = "11.0.0"
description = "PlayPalace v11 Game Server"
requires-python = ">=3.13"
dependencies = [
    "websockets>=14.0",
    "mashumaro>=3.11",
    "fluent.runtime>=0.4.0",
    "babel>=2.14",
    "openskill>=6.1.3",
    "argon2-cffi>=23.1",
    "pydantic>=2.0",
    "pyperclip>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
playpalace-server = "server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Skips PlayAural tests that don't apply here and marks the ones waiting on
# our sound pack; see tests/playpalace_test_policy.py.
addopts = ["-p", "server.tests.playpalace_test_policy"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".."]

[tool.hatch.build.targets.wheel]
packages = ["."]
[tool.hatch.build.targets.wheel.force-include]
"locales" = "server/locales"
"../clients/desktop/sounds" = "server/audio"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
