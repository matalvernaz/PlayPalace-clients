name: Windows Client

# Builds the desktop client as a portable Windows folder (PyInstaller onedir)
# and checks that it starts. The MSI in installers.yml only packs placeholder
# client files, so this is the build to hand to players.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "clients/desktop/**"
      - ".github/workflows/windows-client.yml"

jobs:
  windows-client:
    name: Windows client
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync client dependencies
        shell: pwsh
        run: |
          Set-Location clients/desktop
          uv sync

      - name: Build client executable
        shell: pwsh
        run: |
          Set-Location clients/desktop
          ./build.ps1

      - name: Check the build has its parts
        shell: pwsh
        run: |
          $dist = "clients/desktop/dist/PlayPalace"
          if (-not (Test-Path "$dist/PlayPalace.exe")) {
            throw "PlayPalace.exe is missing from the build. Check the PyInstaller output in the build step."
          }
          $builtSounds = (Get-ChildItem "$dist/sounds" -Recurse -File).Count
          $sourceSounds = (Get-ChildItem "clients/desktop/sounds" -Recurse -File).Count
          Write-Host "Sound files: $builtSounds in the build, $sourceSounds in the source tree."
          if ($builtSounds -ne $sourceSounds) {
            throw "The build has $builtSounds sound files but the source tree has $sourceSounds. Check how build.ps1 moved the sounds folder."
          }

      - name: Upload client
        uses: actions/upload-artifact@v7
        with:
          retention-days: 5
          name: PlayPalace-Windows
          path: clients/desktop/dist/PlayPalace

      - name: Start the client and wait for its login window
        shell: pwsh
        run: |
          $folder = (Resolve-Path "clients/desktop/dist/PlayPalace").Path
          $process = Start-Process -FilePath (Join-Path $folder "PlayPalace.exe") -WorkingDirectory $folder -PassThru
          $expectedTitle = "Play Palace Login"
          $title = ""
          try {
            for ($second = 0; $second -lt 60; $second++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                throw "The client quit during startup with exit code $($process.ExitCode). Run the PlayPalace-Windows artifact to see the error."
              }
              if ($process.MainWindowHandle -eq [IntPtr]::Zero) {
                continue
              }
              $title = $process.MainWindowTitle
              if ($title -eq $expectedTitle) {
                break
              }
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
          if ($title -ne $expectedTitle) {
            throw "The login window never appeared. Last window title seen: '$title'. Run the PlayPalace-Windows artifact to see the error."
          }
          Write-Host "The login window appeared."
